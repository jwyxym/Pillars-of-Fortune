[package]
name = "pillars-of-fortune"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Pillars of Fortune gameplay for the local Pumpkin server"

[lib]
crate-type = ["cdylib"]

[features]
default = []
admin-settings = []

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/jwyxym/Pumpkin.git", branch = "master" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = true

